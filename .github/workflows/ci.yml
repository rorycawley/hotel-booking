name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Install Clojure CLI
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Install clj-kondo
        run: |
          curl -sLO https://raw.githubusercontent.com/clj-kondo/clj-kondo/master/script/install-clj-kondo
          chmod +x install-clj-kondo
          sudo ./install-clj-kondo

      - name: Install cljfmt
        run: |
          curl -sL https://github.com/weavejester/cljfmt/releases/download/0.13.0/cljfmt-0.13.0-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin

      - name: Format check
        run: cljfmt check components bases development projects

      - name: Lint
        run: clj-kondo --lint components bases development projects

      - name: Run fast tests
        run: clojure -X:dev:test

      - name: Check Polylith boundaries
        run: clojure -M:poly check

      - name: Build deployable jar
        working-directory: projects/hotel-system
        run: clojure -T:build uber
