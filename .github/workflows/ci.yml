name: CI

env:
  CLOJURE_CLI_VERSION: "1.11.3.1463"
  POSTGRES_IMAGE: "postgres:16.4-alpine"
  RABBITMQ_IMAGE: "rabbitmq:3.13.7-management-alpine"
  MINIO_IMAGE: "minio/minio:RELEASE.2024-08-17T01-24-54Z"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and Build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Install Clojure CLI
        run: |
          curl -fsSLo "linux-install-${CLOJURE_CLI_VERSION}.sh" \
            "https://download.clojure.org/install/linux-install-${CLOJURE_CLI_VERSION}.sh"
          chmod +x "linux-install-${CLOJURE_CLI_VERSION}.sh"
          sudo "./linux-install-${CLOJURE_CLI_VERSION}.sh"

      - name: Add ~/.local/bin to PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache clj-kondo
        id: cache-clj-kondo
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/clj-kondo
          key: clj-kondo-${{ runner.os }}-v2026.04.15

      - name: Install clj-kondo
        if: steps.cache-clj-kondo.outputs.cache-hit != 'true'
        run: |
          curl -sLO https://raw.githubusercontent.com/clj-kondo/clj-kondo/master/script/install-clj-kondo
          chmod +x install-clj-kondo
          ./install-clj-kondo --dir "$HOME/.local/bin" --version 2026.04.15

      - name: Cache cljfmt
        id: cache-cljfmt
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/cljfmt
          key: cljfmt-${{ runner.os }}-0.13.0

      - name: Install cljfmt
        if: steps.cache-cljfmt.outputs.cache-hit != 'true'
        run: |
          curl -sL https://github.com/weavejester/cljfmt/releases/download/0.13.0/cljfmt-0.13.0-linux-amd64.tar.gz \
            | tar -xz -C "$HOME/.local/bin"

      - name: Format check
        run: cljfmt check components bases development projects

      - name: Lint
        run: clj-kondo --lint components bases development projects

      - name: Check Polylith boundaries
        run: clojure -M:poly check

      - name: Run fast tests
        run: clojure -X:dev:test

      - name: Build deployable jar
        working-directory: projects/hotel-system
        run: clojure -T:build uber

  integration:
    name: Integration tests (Postgres + RabbitMQ + MinIO)
    runs-on: ubuntu-24.04
    # Runs in PARALLEL with `verify` so PR feedback time = max(fast, integration).
    # ubuntu-24.04 already has Docker available; Testcontainers boots its own
    # Postgres + RabbitMQ + MinIO - no GHA service containers needed (we'd lose the
    # `verify-contract` shared-spec property if we hard-coded a fixed setup).

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Install Clojure CLI
        run: |
          curl -fsSLo "linux-install-${CLOJURE_CLI_VERSION}.sh" \
            "https://download.clojure.org/install/linux-install-${CLOJURE_CLI_VERSION}.sh"
          chmod +x "linux-install-${CLOJURE_CLI_VERSION}.sh"
          sudo "./linux-install-${CLOJURE_CLI_VERSION}.sh"

      # Pre-pull the container images in parallel so first-run latency
      # doesn't push Testcontainers wait-strategies near their timeouts.
      - name: Pre-pull container images
        run: |
          docker pull "$POSTGRES_IMAGE" &
          docker pull "$RABBITMQ_IMAGE" &
          docker pull "$MINIO_IMAGE" &
          wait

      - name: Run integration tests
        run: clojure -X:dev:test :excludes '[]'
